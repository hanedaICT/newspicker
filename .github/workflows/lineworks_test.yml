
name: LINE WORKS Notification Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Send test notification
        env:
          LINEWORKS_PRIVATE_KEY: ${{ secrets.LINEWORKS_PRIVATE_KEY }}
          LINEWORKS_CLIENT_ID: ${{ secrets.LINEWORKS_CLIENT_ID }}
          LINEWORKS_SERVICE_ACCOUNT: ${{ secrets.LINEWORKS_SERVICE_ACCOUNT }}
          LINEWORKS_BOT_ID: ${{ secrets.LINEWORKS_BOT_ID }}
          LINEWORKS_CLIENT_SECRET: ${{ secrets.LINEWORKS_CLIENT_SECRET }}
          LINEWORKS_RECIPIENT_ID: ${{ secrets.LINEWORKS_RECIPIENT_ID }}
        run: |
          uv run python -c "from scripts.quality_check import check_quality; from scripts.lineworks_notify import send_lineworks_message; import sys; warnings = check_quality('テスト', '短い本文'); print('重大警告:', warnings); sys.exit(0 if warnings and send_lineworks_message('【重大警告連動テスト】\n' + '\n'.join(warnings)) else 1)"
