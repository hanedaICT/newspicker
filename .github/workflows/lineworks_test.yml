
name: LINE WORKS Notification Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Send test notification
        env:
          LINEWORKS_PRIVATE_KEY: ${{ secrets.LINEWORKS_PRIVATE_KEY }}
          LINEWORKS_CLIENT_ID: ${{ secrets.LINEWORKS_CLIENT_ID }}
          LINEWORKS_SERVICE_ACCOUNT: ${{ secrets.LINEWORKS_SERVICE_ACCOUNT }}
          LINEWORKS_BOT_ID: ${{ secrets.LINEWORKS_BOT_ID }}
          LINEWORKS_CLIENT_SECRET: ${{ secrets.LINEWORKS_CLIENT_SECRET }}
          LINEWORKS_RECIPIENT_ID: ${{ secrets.LINEWORKS_RECIPIENT_ID }}
        run: |
          uv run python -c "from scripts.quality_check import check_quality; from unittest.mock import patch; import sys; body = 'あ' * 1000 + '本日のワールドAIニュースは以上です。また明日お会いしましょう。'; warnings = check_quality('テスト', body); print('重大警告:', warnings); mock = patch('scripts.lineworks_notify.send_lineworks_message').start(); result = bool(warnings) and mock('【AIニュース重大警告】'); print('通知呼び出し回数:', mock.call_count); sys.exit(0 if not warnings and mock.call_count == 0 else 1)"
